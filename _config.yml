title: affiliate_shiwal
description: >-
  Independent coverage of HighLevel CRM updates, features, and workflows
  for agencies deciding whether to switch.
baseurl: "/affiliate_shiwal"
url: "https://shiwal50.github.io"

markdown: kramdown
permalink: /posts/:year/:month/:day/:title/

# Jekyll hides posts dated later than the build server's own clock by default.
# Since posts are dated when written (not necessarily when the build runs),
# this makes sure a post is never silently hidden by a clock mismatch.
future: true

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - scripts
  - README.md
  - node_modules
  - package.json
  - package-lock.json
