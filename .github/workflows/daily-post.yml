name: Daily HighLevel Post Draft

on:
  schedule:
    # 07:00 IST = 01:30 UTC
    - cron: "30 1 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate draft post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/generate_post.js

      - name: Check for new files
        id: check
        run: |
          if git status --porcelain | grep -q "_posts/"; then
            echo "has_draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_draft=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.check.outputs.has_draft == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Draft: daily HighLevel post"
          branch: "draft/${{ github.run_number }}"
          title: "Daily draft ready for review"
          body: |
            Auto-generated draft from today's HighLevel feed run.
            Review the post content and image, edit directly in this PR if needed,
            then merge to publish or close to discard.
          add-paths: |
            _posts/*
            assets/images/*
            scripts/used_sources.json
